<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#07090d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Tournament Remote</title>
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/remote.css">
</head>
<body class="remote">
  <div id="snow-host"></div>
  <header class="r-top">
    <div class="brand"><div class="brand-mark">♠</div></div>
    <div class="r-top-r">
      <span class="conn" id="conn">…</span>
      <button class="icon-btn" id="b-menu" aria-label="Settings shortcuts">⚙</button>
    </div>
  </header>

  <section class="clock-card" id="clock-card">
    <div class="cc-row">
      <div>
        <div class="cc-level" id="cc-level">LEVEL 1</div>
        <div class="cc-blinds tnum" id="cc-blinds">25 / 50</div>
        <div class="cc-next tnum" id="cc-next"></div>
      </div>
      <div class="cc-time tnum" id="cc-time">15:00</div>
    </div>
    <div class="cc-progress"><i id="cc-progress"></i></div>
    <div class="controls">
      <button class="ctl" id="b-prev" aria-label="Previous level">⏮</button>
      <button class="ctl small" id="b-minus" aria-label="Minus one minute">−1m</button>
      <button class="ctl play" id="b-toggle" aria-label="Start or pause">▶</button>
      <button class="ctl small" id="b-plus" aria-label="Plus one minute">+1m</button>
      <button class="ctl" id="b-next" aria-label="Next level">⏭</button>
    </div>
  </section>

  <section class="r-stats" id="r-stats"></section>

  <section class="r-final hidden" id="r-final">
    <div class="r-final-h">🏆 Final results</div>
    <div class="r-final-body" id="r-final-body"></div>
  </section>

  <section class="r-table-wrap">
    <div class="r-bar">
      <span class="r-hint" id="r-hint">Tap a player</span>
      <button class="pill-btn" id="b-arrange">⇄ Arrange seats</button>
    </div>
    <div class="r-table">
      <div class="r-rail"><div class="r-felt"><div class="r-felt-txt" id="r-felt-txt"></div></div></div>
      <div class="r-seats" id="r-seats"></div>
    </div>
    <div class="r-railbox hidden" id="r-railbox" data-drop="rail">
      <div class="r-rail-h"><span>Waiting for a seat</span><small id="rail-tip"></small></div>
      <div class="r-rail-list" id="r-rail-list"></div>
    </div>
  </section>

  <section class="r-undo hidden" id="r-undo">
    <span id="undo-text"></span>
    <button class="btn" id="b-undo">↶ Undo</button>
  </section>

  <section class="r-log">
    <div class="r-log-h">Activity</div>
    <ul id="r-log"></ul>
    <div class="r-links"><a href="/setup">⚙ Settings</a><a href="/display">📺 Display</a></div>
  </section>

  <!-- settings shortcuts -->
  <div class="sheet menu" id="menu" role="dialog" aria-modal="true">
    <div class="grab"></div>
    <div class="menu-h">Change settings</div>
    <div class="menu-grid">
      <a href="/setup#players"><span>👥</span>Players &amp; photos</a>
      <a href="/setup#blinds"><span>⏱</span>Blind structure</a>
      <a href="/setup#money"><span>💰</span>Buy-in &amp; prize pool</a>
      <a href="/setup#payouts"><span>🏆</span>Payouts</a>
      <a href="/setup#chips"><span>🪙</span>Chips</a>
      <a href="/setup#general"><span>⚙</span>General &amp; seats</a>
    </div>
    <a class="btn menu-wide" href="/display" target="_blank">📺 Open TV display</a>
    <button class="btn btn-ghost sh-close" id="menu-close">Close</button>
  </div>

  <!-- bottom sheet -->
  <div class="sheet-bg" id="sheet-bg"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true">
    <div class="grab"></div>
    <div class="sh-head" id="sh-head"></div>
    <div class="sh-actions">
      <button class="act elim" id="a-elim" data-action="player.eliminate">
        <span class="ico">✕</span><span class="lbl">Eliminate</span><span class="why" id="w-elim"></span>
      </button>
      <button class="act rebuy" id="a-rebuy" data-action="player.rebuy">
        <span class="ico">↻</span><span class="lbl" id="l-rebuy">Rebuy</span><span class="why" id="w-rebuy"></span>
      </button>
      <button class="act addon" id="a-addon" data-action="player.addon">
        <span class="ico">＋</span><span class="lbl">Add-on</span><span class="why" id="w-addon"></span>
      </button>
    </div>
    <button class="btn btn-ghost sh-close" id="sh-close">Cancel</button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/remote.js"></script>
</body>
</html>
