<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tournament Display</title>
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/display.css">
</head>
<body class="display">
  <div id="stage">
    <header class="topbar">
      <div class="top-left"></div>
      <div class="top-mid">
        <span class="pill" id="level-pill">LEVEL 1</span>
        <span class="live" id="live">LIVE</span>
      </div>
      <div class="top-right">
        <span class="conn" id="conn">Connecting</span>
        <span class="wall tnum" id="wall">--:--</span>
      </div>
    </header>

    <section class="table-area">
      <div class="table">
        <div class="rail"></div>
        <div class="felt">
          <div class="felt-logo">♠ ♥ ♦ ♣</div>
          <div class="center">
            <div class="lvl-label" id="lvl-label">LEVEL 1</div>
            <div class="timer tnum" id="timer">15:00</div>
            <div class="progress"><i id="progress"></i></div>
            <div class="blinds tnum" id="blinds">25 / 50</div>
            <div class="ante tnum" id="ante"></div>
            <div class="next tnum" id="next"></div>
          </div>
        </div>
      </div>
      <div class="seats" id="seats"></div>
      <div class="empty-msg hidden" id="empty">
        <div>No players yet</div>
        <small>Add players and photos in <b>Settings</b></small>
      </div>
    </section>

    <aside class="side">
      <div class="card pool">
        <div class="k">PRIZE POOL</div>
        <div class="v tnum" id="pool">$0</div>
      </div>
      <div class="card payouts">
        <div class="k">PAYOUTS</div>
        <ol id="payouts"></ol>
      </div>
      <div class="card stats" id="stats"></div>
      <div class="card remote-qr" id="qr-card">
        <img id="qr" alt="">
        <div><div class="k">PHONE REMOTE</div><div class="qr-url" id="qr-url"></div></div>
      </div>
    </aside>

    <footer class="chipbar">
      <div class="k">CHIP VALUES</div>
      <div class="chips" id="chips"></div>
      <div class="waiting hidden" id="waiting"><div class="k">WAITING FOR A SEAT</div><div class="wl" id="wl"></div></div>
    </footer>

    <!-- overlays -->
    <div class="banner" id="banner"></div>
    <div class="spotlight" id="spotlight"></div>
    <div class="winner hidden" id="winner"></div>
    <div class="hint" id="hint">Click anywhere for fullscreen &amp; sound</div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/display.js"></script>
</body>
</html>
